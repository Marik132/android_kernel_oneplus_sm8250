name: Build Kernel for Kebab

on:
  push:
    branches: [ "oneplus/sm8250_t_13.1_op8" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git libssl-dev libelf-dev clang lld llvm libncurses-dev gcc-aarch64-linux-gnu

      - name: Fix Python Syntax
        run: |
          # Автоматично виправляємо код Python 2 на Python 3 для скриптів ядра
          find . -name "*.py" -exec sed -i 's/print \(.*\)/print(\1)/g' {} +

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          
          # 1. Створюємо конфіг
          make O=out ARCH=arm64 vendor/kona-perf_defconfig
          
          # 2. Фікс нових опцій ядра
          make O=out ARCH=arm64 CC=clang olddefconfig
          
          # 3. Повна збірка ядра
          make -j$(nproc) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kebab-Kernel-Build
          path: out/arch/arm64/boot/Image.gz-dtb
