name: Build Kernel

on:
  push:
    branches: [ "oneplus/sm8250_t_13.1_op8" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison build-essential libssl-dev python3 clang lld llvm
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_64-clang-r416183b-1 clang

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH=$PWD/clang/bin:$PATH
          
          # Тут спробуємо зібрати на базі конфігу для 8T (kebab)
          # Якщо файл називається інакше, заміни 'kebab_defconfig' на свій
          make O=out ARCH=arm64 kebab_defconfig
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Kernel-Image
          path: out/arch/arm64/boot/Image.gz-dtb
