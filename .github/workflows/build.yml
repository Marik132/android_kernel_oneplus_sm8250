name: Build Kernel

on:
  push:
    branches: [ "oneplus/sm8250_t_13.1_op8" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          # Додаємо gcc-aarch64-linux-gnu для коректної крос-компіляції
          sudo apt-get install -y git bc bison build-essential libssl-dev python3 clang lld llvm gcc-aarch64-linux-gnu
          
          # Виправлення помилки Git, щоб він не питав логін
          export GIT_TERMINAL_PROMPT=0
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_64.git clang

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH=$PWD/clang/bin:$PATH
          
          # Використовуємо kona-perf_defconfig, як базу для SM8250 (OnePlus 8/8T)
          make O=out ARCH=arm64 vendor/kona-perf_defconfig
          
          # Компіляція
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: out/arch/arm64/boot/Image.gz-dtb
